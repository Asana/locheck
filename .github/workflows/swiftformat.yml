name: SwiftFormat + SwiftLint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install swiftformat
          brew install swiftlint

      - name: SwiftFormat
        run: swiftformat --lint --verbose

      - name: SwiftLint
        run: swiftlint --strict --quiet